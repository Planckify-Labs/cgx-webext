name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install C toolchain and zip
        run: sudo apt-get update && sudo apt-get install -y build-essential zip
      - run: scripts/check.sh

  # The CMake module that Ladybird (or any CMake browser) uses, tested with a throwaway consumer project.
  cmake-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: scripts/test-cmake-module.sh
